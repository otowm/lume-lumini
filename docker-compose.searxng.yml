services:
  searxng:
    image: searxng/searxng:latest
    container_name: lume-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8889:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://127.0.0.1:8889/
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID

