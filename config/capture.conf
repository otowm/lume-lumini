# Intervalo entre o inicio de duas capturas, em segundos.
INTERVAL_SECONDS=20

# Pasta-base. A estrutura AAAA-MM-DD/telas será criada dentro dela.
CAPTURE_ROOT="$HOME/Documentos/otowm-recall/capturas"

# Modo exclusivo: interval (salva sempre no intervalo) ou change (salva ao mudar).
CAPTURE_MODE=interval

# No modo change: frequência de amostragem, percentual mínimo de pixels alterados
# e intervalo máximo sem salvar nenhum frame.
CHANGE_POLL_SECONDS=3
CHANGE_THRESHOLD_PERCENT=3
CHANGE_MAX_INTERVAL_SECONDS=300

# Backend: auto, spectacle ou grim. No KDE/KWin, prefira spectacle.
BACKEND=auto

# Limite da imagem final. Vazio preserva a resolucao original.
# O sufixo ">" impede ampliar imagens menores.
MAX_GEOMETRY="1920x1080>"

# Vazio = desktop virtual inteiro em um arquivo "mon-all".
# Com grim, use nomes separados por espaco, por exemplo: "DP-1 HDMI-A-1".
OUTPUTS=""

# No backend spectacle, recorta o desktop virtual usando a geometria do KScreen.
SPLIT_MONITORS=true

# Se nao for possivel descobrir a janela ativa, nao capture. Recomendado.
PRIVACY_FAIL_CLOSED=true
