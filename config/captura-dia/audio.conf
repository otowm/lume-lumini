# Tratamento do microfone antes de gravar (faixa c0 do WAV de 3 canais).
# Não afeta Discord (c1) nem sistema (c2): quem já chega limpo não precisa de
# supressão nem de portão de ruído.

# Reduz ruído de fundo constante (ventoinha, chiado) com o afftdn do ffmpeg.
MIC_DENOISE_ENABLED=true

# Portão de ruído: abaixo deste volume (em dBFS) o microfone é silenciado, como
# a "sensibilidade de entrada" do Discord. Mais perto de 0 = mais agressivo;
# mais negativo = deixa passar mais ruído de fundo.
MIC_GATE_THRESHOLD_DB=-45
